<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pötty Túlélő 2</title>
<style>
:root{--sw:min(calc(100vw - 16px),calc((100vh - 44px)*1.5));--y:#ffd23f}
html,body{height:100%;margin:0;background:#0f1117;color:#e8e8ee;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overflow:hidden}
#wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:6px;padding:8px;box-sizing:border-box}
#stage{position:relative;width:var(--sw);height:calc(var(--sw)/1.5);flex:none;font-size:clamp(11px,calc(var(--sw)*.022),20px)}
canvas{width:100%;height:100%;display:block;border-radius:12px;box-shadow:0 0 0 2px #2c3040;touch-action:none;background:radial-gradient(circle at center,#20242f,#101218)}
#hud{position:absolute;top:8px;left:8px;display:none;gap:1.2em;font-weight:600;padding:.4em .9em;background:rgba(24,27,34,.78);border-radius:10px;box-shadow:0 0 0 2px #3a3f4c;color:#fff;pointer-events:none}
#stage.ingame #hud{display:flex}
.label{opacity:.65;margin-right:4px}
#hint{opacity:.55;font-size:.75rem;height:22px;line-height:22px;flex:none;text-align:center}
.panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);display:none;flex-direction:column;align-items:center;gap:10px;
  background:rgba(24,27,34,.92);color:#fff;padding:22px 32px;border-radius:14px;min-width:230px;max-width:90%;box-sizing:border-box;
  text-align:center;box-shadow:0 0 0 2px #3a3f4c,0 4px 14px rgba(0,0,0,.4)}
.panel.show{display:flex}
.ttl{font-size:1.3rem;font-weight:800;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.sub{color:#d7dae2;font-size:.85rem;margin-bottom:4px}
.btn{width:100%;padding:10px 20px;border:none;border-radius:8px;background:var(--y);color:#1a1a1a;font-weight:700;font-size:1rem;cursor:pointer}
.btn.sec{background:rgba(24,27,34,.85);color:#f5f6fa;box-shadow:0 0 0 2px #ffffff88}
.btn:focus-visible,.flag:focus-visible{outline:3px solid #fff;outline-offset:2px}
#settings{width:min(94%,460px);gap:8px;padding:16px 22px}
.row{width:100%;display:flex;flex-direction:row;gap:12px;align-items:center;justify-content:space-between;padding:6px 14px;border-radius:10px;box-shadow:0 0 0 2px #ffffff55;box-sizing:border-box}
.row b{font-size:.9rem;white-space:nowrap;text-align:left}
.row .sub{margin:0;min-width:40px;text-align:right}
#vol{flex:1;min-width:80px;max-width:230px;margin:0;accent-color:var(--y);cursor:pointer}
.tog{padding:5px 22px;border:none;border-radius:8px;font-weight:800;cursor:pointer;background:#555b6b;color:#fff}
.tog.on{background:#2ecc71;color:#10151a}
.flags{display:flex;gap:10px}
.flag{width:36px;height:36px;border-radius:50%;padding:3px;border:3px solid transparent;background:none;cursor:pointer;overflow:hidden;box-sizing:border-box}
.flag svg{width:100%;height:100%;border-radius:50%;display:block}
.flag.sel{border-color:#2ecc71}
.pad{position:absolute;bottom:10px;display:none;grid-template-columns:repeat(3,46px);grid-template-rows:repeat(3,46px);gap:4px}
#padL{left:10px}#padR{right:10px}
.tb{width:46px;height:46px;border-radius:50%;border:2px solid #ffffffaa;background:rgba(24,27,34,.6);color:#fff;font-size:1.2rem;padding:0;touch-action:none;user-select:none;-webkit-user-select:none}
.tb:active{background:rgba(255,255,255,.3)}
#tPause{position:absolute;right:10px;top:10px;display:none;width:40px;height:40px}
#tNitro{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);display:none;border-color:#a8d8ff}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c" width="720" height="480"></canvas>
    <div id="hud">
      <div><span class="label" data-i="score"></span><span id="score">0</span></div>
      <div><span class="label" data-i="lives"></span><span id="hearts"></span></div>
      <div><span class="label" data-i="nitro"></span><span id="nitroS">⚡</span></div>
    </div>

    <div class="panel" id="menu">
      <div class="ttl" data-i="title"></div>
      <div class="sub" data-i="sub"></div>
      <button class="btn" id="startBtn" data-i="start"></button>
      <button class="btn sec" id="setBtn" data-i="settings"></button>
    </div>

    <div class="panel" id="pause">
      <div class="ttl" data-i="paused"></div>
      <button class="btn" id="resumeBtn" data-i="resume"></button>
      <button class="btn sec" id="setBtn2" data-i="settings"></button>
      <button class="btn sec" id="menuBtn2" data-i="menu"></button>
    </div>

    <div class="panel" id="over">
      <div class="ttl" id="overText"></div>
      <button class="btn" id="retryBtn" data-i="retry"></button>
      <button class="btn sec" id="menuBtn3" data-i="menu"></button>
    </div>

    <div class="panel" id="settings">
      <div class="ttl" data-i="settings"></div>
      <div class="row"><b data-i="volume"></b><input type="range" id="vol" min="0" max="100" value="100"><span id="volL" class="sub"></span></div>
      <div class="row"><b data-i="touch"></b><button class="tog" id="touchTog"></button></div>
      <div class="row"><b data-i="lang"></b>
        <div class="flags">
          <button class="flag" id="fHu" title="Magyar"><svg viewBox="0 0 60 40" preserveAspectRatio="xMidYMid slice"><rect width="60" height="14" fill="#ce2939"/><rect y="13" width="60" height="14" fill="#fff"/><rect y="26" width="60" height="14" fill="#477050"/></svg></button>
          <button class="flag" id="fEn" title="English"><svg viewBox="0 0 60 30" preserveAspectRatio="xMidYMid slice"><rect width="60" height="30" fill="#012169"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/><path d="M0,0 L60,30 M60,0 L0,30" stroke="#C8102E" stroke-width="3"/><path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/><path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/></svg></button>
        </div>
      </div>
      <button class="btn sec" id="backBtn" data-i="back"></button>
    </div>

    <div class="pad" id="padL">
      <button class="tb" data-k="w" style="grid-area:1/2">▲</button>
      <button class="tb" data-k="a" style="grid-area:2/1">◀</button>
      <button class="tb" data-k="d" style="grid-area:2/3">▶</button>
      <button class="tb" data-k="s" style="grid-area:3/2">▼</button>
    </div>
    <div class="pad" id="padR">
      <button class="tb" data-k="arrowup" style="grid-area:1/2">▲</button>
      <button class="tb" data-k="arrowleft" style="grid-area:2/1">◀</button>
      <button class="tb" data-k="arrowright" style="grid-area:2/3">▶</button>
      <button class="tb" data-k="arrowdown" style="grid-area:3/2">▼</button>
    </div>
    <button class="tb" id="tPause">⏸</button>
    <button class="tb" id="tNitro" data-k="e">⚡</button>
  </div>
  <div id="hint" data-i="hint"></div>
</div>

<script>
const $=id=>document.getElementById(id), cv=$('c'), ctx=cv.getContext('2d'), W=720, H=480;
const rand=(a,b)=>a+Math.random()*(b-a);

// --- Mentett adatok ---
let settings={volume:100,touch:false,lang:'hu'}, best=0;
try{
  const s=JSON.parse(localStorage.getItem('pt2Settings')||'null');
  if(s){ if(typeof s.volume==='number')settings.volume=Math.max(0,Math.min(100,s.volume));
    if(typeof s.touch==='boolean')settings.touch=s.touch; if(s.lang==='hu'||s.lang==='en')settings.lang=s.lang; }
  best=+localStorage.getItem('pt2Best')||0;
}catch(e){}
const saveSettings=()=>{try{localStorage.setItem('pt2Settings',JSON.stringify(settings));}catch(e){}};

// --- Nyelvek ---
const I18N={
  hu:{title:'🔴 Pötty Túlélő 2',sub:'Lődd le a kékeket, mielőtt elérnek!',start:'Indítás',settings:'Beállítások',paused:'⏸️ Szünet',
    resume:'Folytatás',menu:'Főmenü',retry:'Újra',score:'Pont:',lives:'Élet:',nitro:'Nitró:',volume:'Hangerő 🔊',touch:'Érintős vezérlés 📱',
    lang:'Nyelv 🌐',back:'Vissza ◀️',on:'Be',off:'Ki',hint:'WASD: mozgás — Nyilak: lövés — E: nitró — Esc: szünet',
    overNew:s=>`Vége! Pontszám: ${s} — Új rekord! 🏆`,overOld:(s,b)=>`Vége! Pontszám: ${s} (Rekord: ${b})`},
  en:{title:'🔴 Dot Survivor 2',sub:'Shoot the blue dots before they reach you!',start:'Start',settings:'Settings',paused:'⏸️ Paused',
    resume:'Resume',menu:'Main menu',retry:'Retry',score:'Score:',lives:'Lives:',nitro:'Nitro:',volume:'Volume 🔊',touch:'Touch controls 📱',
    lang:'Language 🌐',back:'Back ◀️',on:'On',off:'Off',hint:'WASD: move — Arrows: shoot — E: nitro — Esc: pause',
    overNew:s=>`Game over! Score: ${s} — New record! 🏆`,overOld:(s,b)=>`Game over! Score: ${s} (Record: ${b})`}
};
const t=(k,...a)=>{const v=I18N[settings.lang][k];return typeof v==='function'?v(...a):v;};
function applyLang(){
  document.documentElement.lang=settings.lang;
  document.title=t('title').replace('🔴 ','');
  document.querySelectorAll('[data-i]').forEach(el=>el.textContent=t(el.dataset.i));
  $('fHu').classList.toggle('sel',settings.lang==='hu');
  $('fEn').classList.toggle('sel',settings.lang==='en');
  $('touchTog').textContent=settings.touch?t('on'):t('off');
  $('touchTog').classList.toggle('on',settings.touch);
}

// --- Hangeffektek ---
let audioCtx=null;
function getCtx(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  return audioCtx;
}
function beep({freq=440,duration=.1,type='sine',volume=.2,slideTo=null}={}){
  if(settings.volume<=0)return;
  volume*=settings.volume/100;
  try{
    const c=getCtx(), o=c.createOscillator(), g=c.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,c.currentTime);
    if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,c.currentTime+duration);
    g.gain.setValueAtTime(volume,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+duration);
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+duration);
  }catch(e){}
}
const sfx={
  shoot:()=>beep({freq:900,duration:.07,type:'square',volume:.07,slideTo:350}),
  kill:()=>beep({freq:420,duration:.12,type:'triangle',volume:.2,slideTo:900}),
  hit:()=>beep({freq:200,duration:.22,type:'sawtooth',volume:.25,slideTo:60}),
  gameover:()=>beep({freq:320,duration:.5,type:'square',volume:.2,slideTo:70}),
  click:()=>beep({freq:600,duration:.05,type:'square',volume:.12}),
  nitro:()=>beep({freq:180,duration:.28,type:'sawtooth',volume:.16,slideTo:1000}),
  nitroEnd:()=>beep({freq:700,duration:.3,type:'triangle',volume:.13,slideTo:140})
};

// --- Háttérzene: nyugodt a menüben, pörgős a játékban ---
const TRACKS={
  menu:{step:.6,type:'sine',vol:.05,
    lead:[220,329.63,392,329.63,261.63,329.63,293.66,246.94],
    bass:[110,0,0,0,98,0,0,0]},
  game:{step:.14,type:'square',vol:.028,
    lead:[440,440,523.25,440,659.25,440,587.33,523.25,392,392,493.88,392,587.33,392,523.25,493.88],
    bass:[110,110,110,110,110,110,110,110,98,98,98,98,98,98,98,98]}
};
let musicTimer=null, currentMusic=null, wantMusic='menu', unlocked=false;
function playMusic(name){
  wantMusic=name;
  if(!unlocked)return;
  if(name===null){clearTimeout(musicTimer);currentMusic=null;return;}
  if(currentMusic===name)return;
  clearTimeout(musicTimer); currentMusic=name;
  const tr=TRACKS[name]; let i=0;
  (function step(){
    if(currentMusic!==name)return;
    beep({freq:tr.lead[i%tr.lead.length],duration:tr.step*.85,type:tr.type,volume:tr.vol});
    const b=tr.bass[i%tr.bass.length];
    if(b){
      if(name==='game')beep({freq:b/2,duration:tr.step*.9,type:'sawtooth',volume:.05});
      else beep({freq:b,duration:tr.step*5,type:'sine',volume:.06});
    }
    if(name==='game'&&i%4===0)beep({freq:130,duration:.1,type:'sine',volume:.14,slideTo:45});
    i++; musicTimer=setTimeout(step,tr.step*1000);
  })();
}
function unlock(){ if(unlocked)return; unlocked=true; getCtx(); playMusic(wantMusic); }
addEventListener('pointerdown',unlock,{once:true});
addEventListener('keydown',unlock,{once:true});

// --- Menüháttér: csillagos ég, fehér lövedék-csíkokkal ---
const stars=Array.from({length:90},()=>({x:rand(0,W),y:rand(0,H),z:rand(.3,1),p:rand(0,6.28)}));
let streaks=[];
function drawIdle(dt,now){
  const sh=Math.sin(now/5000)*40, g=ctx.createLinearGradient(0,0,W,H);
  g.addColorStop(0,`hsl(${225+sh},55%,9%)`); g.addColorStop(1,`hsl(${285+sh},50%,16%)`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  for(const s of stars){
    s.x-=22*s.z*dt; if(s.x<0){s.x=W;s.y=rand(0,H);}
    ctx.globalAlpha=.35+.4*Math.sin(now/600+s.p)**2;
    ctx.fillStyle='#fff'; ctx.fillRect(s.x,s.y,1+s.z*2,1+s.z*2);
  }
  if(Math.random()<dt*1.2){
    const a=[[1,0],[-1,0],[0,1],[0,-1]][Math.floor(rand(0,4))];
    streaks.push({x:rand(0,W),y:rand(0,H),dx:a[0],dy:a[1],life:1});
  }
  ctx.lineWidth=3; ctx.lineCap='round'; ctx.strokeStyle='#fff';
  streaks=streaks.filter(s=>{
    s.x+=s.dx*380*dt; s.y+=s.dy*380*dt; s.life-=dt*.7;
    ctx.globalAlpha=Math.max(0,s.life)*.6;
    ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.lineTo(s.x-s.dx*40,s.y-s.dy*40); ctx.stroke();
    return s.life>0;
  });
  ctx.globalAlpha=1;
}

// --- Játék ---
const MAX_LIVES=3, SPEED=220, BULLET_SPEED=560, COOLDOWN=500;
const AIM={arrowup:[0,-1],arrowdown:[0,1],arrowleft:[-1,0],arrowright:[1,0]};
let keys={}, lastArrow=null, state='menu', from='menu';
let P,E,B,score,lives,invUntil,nextShot,spawnT,elapsed,nitroOn,nitroT,nitroCd,trail;

function hearts(){ let s=''; for(let i=0;i<MAX_LIVES;i++)s+=i<lives?'❤️':'🖤'; $('hearts').textContent=s; }
function spawnEnemy(){
  let x,y,n=0;
  do{
    const e=Math.floor(rand(0,4));
    x=e===0?0:e===1?W:rand(0,W); y=e===2?0:e===3?H:rand(0,H);
  }while(Math.hypot(x-P.x,y-P.y)<160&&++n<10);
  return{x,y,r:16,k:rand(.85,1.15)};
}
function newGame(){
  P={x:W/2,y:H/2,r:15};
  E=[];B=[];score=0;lives=MAX_LIVES;invUntil=0;nextShot=0;spawnT=2;elapsed=0;
  nitroOn=false;nitroT=0;nitroCd=0;trail=[];
  E.push(spawnEnemy(),spawnEnemy());
  $('score').textContent=0; hearts();
  show(''); setState('playing');
}
function aimDir(){
  if(lastArrow&&keys[lastArrow])return AIM[lastArrow];
  for(const k in AIM)if(keys[k])return AIM[k];
  return null;
}
function update(dt,now){
  elapsed+=dt;
  if(nitroOn){
    nitroT-=dt;
    if(nitroT<=0){nitroOn=false;nitroCd=10;sfx.nitroEnd();}
  }else if(nitroCd>0){
    nitroCd=Math.max(0,nitroCd-dt);
  }else if(keys.e){
    nitroOn=true;nitroT=1;sfx.nitro();
  }
  if(nitroOn)trail.push({x:P.x,y:P.y,a:1});
  for(const p of trail)p.a-=dt*3;
  trail=trail.filter(p=>p.a>0);
  const ns=nitroOn?'💨':nitroCd>0?Math.ceil(nitroCd)+' '+(settings.lang==='hu'?'mp':'s'):'⚡';
  if($('nitroS').textContent!==ns)$('nitroS').textContent=ns;
  const spd=SPEED*(nitroOn?2:1);
  const dx=(keys.d?1:0)-(keys.a?1:0), dy=(keys.s?1:0)-(keys.w?1:0);
  if(dx||dy){const l=Math.hypot(dx,dy);P.x+=dx/l*spd*dt;P.y+=dy/l*spd*dt;}
  P.x=Math.max(P.r,Math.min(W-P.r,P.x)); P.y=Math.max(P.r,Math.min(H-P.r,P.y));

  if(now>=nextShot){
    const d=aimDir();
    if(d){B.push({x:P.x,y:P.y,dx:d[0],dy:d[1]});nextShot=now+COOLDOWN;sfx.shoot();}
  }

  spawnT-=dt;
  if(spawnT<=0){ if(E.length<30)E.push(spawnEnemy()); spawnT=Math.max(1,2.4-elapsed*.012); }
  const sp=Math.min(95,45+score*.35);
  for(const e of E){
    const a=Math.atan2(P.y-e.y,P.x-e.x);
    e.x+=Math.cos(a)*sp*e.k*dt; e.y+=Math.sin(a)*sp*e.k*dt;
  }
  for(let i=0;i<E.length;i++)for(let j=i+1;j<E.length;j++){
    const a=E[i],b=E[j],d=Math.hypot(a.x-b.x,a.y-b.y)||.01,m=a.r+b.r;
    if(d<m){const px=(a.x-b.x)/d*(m-d)/2,py=(a.y-b.y)/d*(m-d)/2;a.x+=px;a.y+=py;b.x-=px;b.y-=py;}
  }

  for(let i=B.length-1;i>=0;i--){
    const b=B[i]; b.x+=b.dx*BULLET_SPEED*dt; b.y+=b.dy*BULLET_SPEED*dt;
    if(b.x<-30||b.x>W+30||b.y<-30||b.y>H+30){B.splice(i,1);continue;}
    const hit=E.findIndex(e=>Math.hypot(e.x-b.x,e.y-b.y)<e.r+3||Math.hypot(e.x-(b.x-b.dx*14),e.y-(b.y-b.dy*14))<e.r+3);
    if(hit>=0){E.splice(hit,1);B.splice(i,1);score+=10;$('score').textContent=score;sfx.kill();}
  }

  if(now>=invUntil){
    for(const e of E){
      if(Math.hypot(P.x-e.x,P.y-e.y)<P.r+e.r-3){
        lives--; hearts(); sfx.hit();
        const a=Math.atan2(P.y-e.y,P.x-e.x);
        P.x=Math.max(P.r,Math.min(W-P.r,P.x+Math.cos(a)*60));
        P.y=Math.max(P.r,Math.min(H-P.r,P.y+Math.sin(a)*60));
        invUntil=now+1000;
        if(lives<=0)gameOver();
        break;
      }
    }
  }
}
function drawGame(now){
  ctx.clearRect(0,0,W,H);
  ctx.lineCap='round';ctx.lineJoin='round';ctx.strokeStyle='#a8d8ff';ctx.lineWidth=P.r*1.6;
  for(let i=1;i<trail.length;i++){
    ctx.globalAlpha=Math.max(0,trail[i].a)*.35;
    ctx.beginPath();ctx.moveTo(trail[i-1].x,trail[i-1].y);ctx.lineTo(trail[i].x,trail[i].y);ctx.stroke();
  }
  ctx.globalAlpha=1;
  if(nitroOn){
    ctx.strokeStyle='rgba(168,216,255,.45)';ctx.lineWidth=7;
    ctx.beginPath();ctx.arc(P.x,P.y,P.r+7,0,7);ctx.stroke();
  }
  ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.lineCap='round';
  for(const b of B){ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.lineTo(b.x-b.dx*18,b.y-b.dy*18);ctx.stroke();}
  ctx.fillStyle='#3f8dff';
  for(const e of E){ctx.beginPath();ctx.arc(e.x,e.y,e.r,0,7);ctx.fill();}
  ctx.fillStyle=(now<invUntil&&Math.floor(now/100)%2===0)?'#ff9aa2':'#ff4757';
  ctx.beginPath();ctx.arc(P.x,P.y,P.r,0,7);ctx.fill();
}
function gameOver(){
  setState('over'); sfx.gameover();
  const isNew=score>best;
  if(isNew){best=score;try{localStorage.setItem('pt2Best',best);}catch(e){}}
  $('overText').textContent=isNew?t('overNew',score):t('overOld',score,best);
  show('over');
}

let last=0;
function loop(now){
  const dt=Math.min((now-last)/1000,.05); last=now;
  if(state==='playing'){update(dt,now); if(state==='playing')drawGame(now);}
  if(state==='over')drawGame(now);
  else if(state!=='playing')drawIdle(dt,now);
  requestAnimationFrame(loop);
}

// --- Menük és állapotok ---
const panels=['menu','pause','settings','over'];
function show(name){panels.forEach(p=>$(p).classList.toggle('show',p===name));}
function setState(s){
  state=s;
  $('stage').classList.toggle('ingame',s==='playing');
  playMusic(s==='playing'?'game':s==='over'?null:'menu');
  syncTouch();
}
function syncTouch(){
  const on=settings.touch&&state==='playing';
  $('padL').style.display=$('padR').style.display=on?'grid':'none';
  $('tPause').style.display=on?'block':'none';
  $('tNitro').style.display=on?'block':'none';
  if(!on&&!settings.touch)for(const k of ['w','a','s','d','e',...Object.keys(AIM)])keys[k]=false;
}
function toMenu(){ setState('menu'); show('menu'); }
function openSettings(){ from=state==='paused'?'pause':'menu'; show('settings'); }
function resume(){ show(''); setState('playing'); }
function togglePause(){
  if(state==='playing'){setState('paused');show('pause');}
  else if(state==='paused'){ $('settings').classList.contains('show')?$('backBtn').click():resume(); }
}

const click=(id,fn)=>$(id).onclick=()=>{sfx.click();fn();};
click('startBtn',newGame); click('retryBtn',newGame);
click('setBtn',openSettings); click('setBtn2',openSettings);
click('resumeBtn',resume);
click('menuBtn2',toMenu); click('menuBtn3',toMenu);
click('backBtn',()=>show(from));

const vol=$('vol');
function syncSettings(){vol.value=settings.volume;$('volL').textContent=settings.volume+'%';}
vol.oninput=()=>{settings.volume=+vol.value;$('volL').textContent=settings.volume+'%';saveSettings();};
vol.onchange=()=>sfx.click();
click('touchTog',()=>{settings.touch=!settings.touch;saveSettings();applyLang();syncTouch();});
click('fHu',()=>{settings.lang='hu';saveSettings();applyLang();});
click('fEn',()=>{settings.lang='en';saveSettings();applyLang();});

// --- Billentyűzet és érintés ---
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k in AIM){e.preventDefault();lastArrow=k;}
  keys[k]=true;
  if(k==='escape'&&!e.repeat)togglePause();
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{keys={};});
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;if(k in AIM)lastArrow=k;});
  ['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false;}));
  b.addEventListener('contextmenu',e=>e.preventDefault());
});
$('tPause').addEventListener('pointerdown',e=>{e.preventDefault();togglePause();});

syncSettings(); applyLang(); hearts(); show('menu');
requestAnimationFrame(loop);
</script>
</body>
</html>
